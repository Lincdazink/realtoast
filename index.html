    <style>
         <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .timer-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    #display {
      font-size: 3rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    button.reset {
      background-color: #dc3545;
    }
    button.reset:hover {
      background-color: #a71d2a;
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <div id="display">01:00</div>
    <button onclick="startTimer()">Start</button>
    <button class="reset" onclick="resetTimer()">Reset</button>
  </div>

  <script>
    let totalSeconds = 60; // Set your default time in seconds (e.g., 60 seconds)
    let remainingSeconds = totalSeconds;
    let timerInterval = null;

    const displayElement = document.getElementById('display');

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      displayElement.textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerInterval !== null) return; // Prevent multiple intervals from stacking

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          alert('Time is up!');
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    updateDisplay();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count-Up Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .timer-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    #display {
      font-size: 3rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #28a745;
      color: white;
    }
    button:hover {
      background-color: #218838;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <div id="display">00:00</div>
    <button id="startBtn" onclick="startTimer()">Start</button>
  </div>

  <script>
    let totalSeconds = 0;
    let timerInterval = null;

    const displayElement = document.getElementById('display');
    const startButton = document.getElementById('startBtn');

    function updateDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      displayElement.textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerInterval !== null) return; 
      
      // Disables the button after clicking so it can't be stopped or restarted
      startButton.disabled = true; 

      timerInterval = setInterval(() => {
        totalSeconds++;
        updateDisplay();
      }, 1000);
    }
  </script>
    </script>

</body>
</html>
