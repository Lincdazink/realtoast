<!DOCTYPE html> 
<body>
<h1> whoever worships the bread the longest gets free chips-Linc</h1>

<meta charset="UTF-8">
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Toast Timer & Leaderboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7ede2;
            color: #3d5a80;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 4px solid #f28482;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #e07a5f;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .bread-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #f28482;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #3d5a80;
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
        }

        .user-tag {
            font-size: 1.1rem;
            background: #f28482;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 25px;
        }

        .btn {
            background: #e07a5f;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 10px;
            display: block;
        }

        .btn:hover {
            background-color: #d96a4a;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #3d5a80;
        }

        .btn-secondary:hover {
            background-color: #2a4160;
        }

        .leaderboard h2 {
            font-size: 1.5rem;
            color: #e07a5f;
            margin-bottom: 20px;
        }

        .leaderboard-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: left;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #fdf0ed;
            margin-bottom: 8px;
            border-radius: 8px;
            font-weight: 500;
        }

        .leaderboard-item:nth-child(1) {
            background: #f4a261;
            color: white;
            font-weight: bold;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #3d5a80;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            color: #3d5a80;
        }

        .modal input:focus {
            border-color: #e07a5f;
        }
    </style>
</head>
<body>

    
    <div class="overlay" id="usernameOverlay">
        <div class="modal">
            <h3>Enter Username to Start</h3>
            
            <input type="text" id="usernameInput" placeholder="ToastMaster99" maxlength="15">
         
            <button class="btn" id="startButton" onclick="handleStartClick()">Start Toasting 🍞</button>
        </div>
    </div>

  
    <div class="container">
        
        <div id="timerScreen" class="screen active">
            <h1>Real Toast Timer</h1>
            
            <img src="https://unsplash.com" alt="Delicious Bread" class="bread-img">
            
            <div>Current Toaster:</div>
            <div class="user-tag" id="currentUserDisplay">---</div>

            <div class="timer-display" id="timer">00:00:00</div>

            <button class="btn" id="navToLeaderboardBtn" onclick="showLeaderboard()">View Leaderboard 🏆</button>
        </div>

        
        <div id="leaderboardScreen" class="screen leaderboard">
            <h2>🏆 Leaderboard (Highest Times)</h2>
            
            <ul class="leaderboard-list" id="leaderboardList">
               
            </ul>

            <button class="btn btn-secondary" id="navToTimerBtn" onclick="showTimer()">Back to Toasting 🍞</button>
        </div>

    </div>

    
    <script>
        let startTime;
        let timerInterval;
        let currentUsername = "";

     
        const overlay = document.getElementById('usernameOverlay');
        const usernameInput = document.getElementById('usernameInput');
        const currentUserDisplay = document.getElementById('currentUserDisplay');
        const timerDisplay = document.getElementById('timer');
        const leaderboardList = document.getElementById('leaderboardList');
        
        const timerScreen = document.getElementById('timerScreen');
        const leaderboardScreen = document.getElementById('leaderboardScreen');

  
        displayLeaderboard();

       
        function handleStartClick() {
            const name = usernameInput.value.trim();
            if (name) {
                currentUsername = name;
                currentUserDisplay.textContent = currentUsername;
                overlay.style.display = 'none';
                startTimer();
            } else {
                alert("Please enter a valid username!");
            }
        }

        function showLeaderboard() {
            timerScreen.classList.remove('active');
            leaderboardScreen.classList.add('active');
            displayLeaderboard();
        }

        function showTimer() {
            leaderboardScreen.classList.remove('active');
            timerScreen.classList.add('active');
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const elapsedTime = Date.now() - startTime;
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');

            timerDisplay.textContent = `${hrs}:${mins}:${secs}`;
            saveScore(currentUsername, totalSeconds);
        }

        function saveScore(username, seconds) {
            let leaderboard = JSON.parse(localStorage.getItem('toast_leaderboard')) || [];
            const playerIndex = leaderboard.findIndex(p => p.name === username);

            if (playerIndex > -1) {
                if (seconds > leaderboard[playerIndex].score) {
                    leaderboard[playerIndex].score = seconds;
                }
            } else {
                leaderboard.push({ name: username, score: seconds });
            }

            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('toast_leaderboard', JSON.stringify(leaderboard));
        }

        function displayLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('toast_leaderboard')) || [];
            leaderboardList.innerHTML = "";

            if (leaderboard.length === 0) {
                leaderboardList.innerHTML = `<li class="leaderboard-item" style="justify-content: center;">No high scores yet!</li>`;
                return;
            }

            leaderboard.forEach((player, index) => {
                const item = document.createElement('li');
                item.className = "leaderboard-item";
                
                const hrs = Math.floor(player.score / 3600).toString().padStart(2, '0');
                const mins = Math.floor((player.score % 3600) / 60).toString().padStart(2, '0');
                const secs = (player.score % 60).toString().padStart(2, '0');
                

item.innerHTML = `<span>#${index + 1} ${player.name}</span> <span>${hrs}:${mins}:${secs}</span>`;
leaderboardList.appendChild(item);
});
}

</body>
</html>

</body>
