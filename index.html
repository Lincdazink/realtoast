<!DOCTYPE html> 
<body>
<h1> whoever worships the bread the longest gets free chips-Linc</h1>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Toast Timer & Leaderboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7ede2;
            color: #3d5a80;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 4px solid #f28482;
        }

        h1 {
            color: #e07a5f;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .bread-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #f28482;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #3d5a80;
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
        }

        .user-tag {
            font-size: 1.1rem;
            background: #f28482;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 25px;
        }

        .leaderboard {
            margin-top: 20px;
            text-align: left;
            border-top: 2px dashed #f28482;
            padding-top: 20px;
        }

        .leaderboard h2 {
            font-size: 1.3rem;
            color: #e07a5f;
            margin-bottom: 10px;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #fdf0ed;
            margin-bottom: 6px;
            border-radius: 8px;
            font-weight: 500;
        }

        .leaderboard-item:nth-child(1) {
            background: #f4a261;
            color: white;
            font-weight: bold;
        }

        /* Username Modal Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #3d5a80;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .modal input:focus {
            border-color: #e07a5f;
        }

        .modal button {
            background: #e07a5f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .modal button:hover {
            background: #ced4da;
            background-color: #d96a4a;
        }
    </style>
</head>
<body>

    <!-- Username Setup Overlay -->
    <div class="overlay" id="usernameOverlay">
        <div class="modal">
            <h3>Enter Username to Start</h3>
            <input type="text" id="usernameInput" placeholder="ToastMaster99" maxlength="15" required>
            <button id="startButton">Start Toasting 🍞</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1>Real Toast Timer</h1>
        
        <!-- Photo of Bread -->
        <img src="https://unsplash.com" alt="Delicious Bread" class="bread-img">
        
        <div>Current Toaster:</div>
        <div class="user-tag" id="currentUserDisplay">---</div>

        <!-- Up-Counting Timer (No Stop Button) -->
        <div class="timer-display" id="timer">00:00:00</div>

        <!-- Leaderboard -->
        <div class="leaderboard">
            <h2>🏆 Leaderboard (Highest Times)</h2>
            <ul class="leaderboard-list" id="leaderboardList">
                <!-- Scores injected by JS -->
            </ul>
        </div>
    </div>

    <script>
        let startTime;
        let timerInterval;
        let currentUsername = "";

        const overlay = document.getElementById('usernameOverlay');
        const usernameInput = document.getElementById('usernameInput');
        const startButton = document.getElementById('startButton');
        const currentUserDisplay = document.getElementById('currentUserDisplay');
        const timerDisplay = document.getElementById('timer');
        const leaderboardList = document.getElementById('leaderboardList');

        // Load leaderboard on boot
        displayLeaderboard();

        // Handle user signup and start timer
        startButton.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                currentUsername = name;
                currentUserDisplay.textContent = currentUsername;
                overlay.style.display = 'none'; // Close overlay
                startTimer();
            } else {
                alert("Please enter a valid username!");
            }
        });

        // Start the continuous up-timer
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const elapsedTime = Date.now() - startTime;
            
            // Calculate hours, minutes, seconds
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');

            timerDisplay.textContent = `${hrs}:${mins}:${secs}`;

            // Continually save and update the score in the leaderboard live
            saveScore(currentUsername, totalSeconds);
        }

        // LocalStorage Leaderboard logic
        function saveScore(username, seconds) {
            let leaderboard = JSON.parse(localStorage.getItem('toast_leaderboard')) || [];
            
            // Check if player already exists in database
            const playerIndex = leaderboard.findIndex(p => p.name === username);

            if (playerIndex > -1) {
                // Only update if current live time is higher than their past saved high score
                if (seconds > leaderboard[playerIndex].score) {
                    leaderboard[playerIndex].score = seconds;
                }
            } else {
                // Add new entry
                leaderboard.push({ name: username, score: seconds });
            }

            // Sort leaderboard: Highest score (most seconds survived) on top
            leaderboard.sort((a, b) => b.score - a.score);

            // Keep top 10 rows
            leaderboard = leaderboard.slice(0, 10);

            localStorage.setItem('toast_leaderboard', JSON.stringify(leaderboard));
            displayLeaderboard();
        }

        function displayLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('toast_leaderboard')) || [];
            leaderboardList.innerHTML = "";

            if (leaderboard.length === 0) {
                leaderboardList.innerHTML = `<li class="leaderboard-item" style="justify-content: center;">No high scores yet!</li>`;
                return;
            }

            leaderboard.forEach((player, index) => {
                const item = document.createElement('li');
                item.className = "leaderboard-item";
                
                // Format score seconds back to clean text string
                const hrs = Math.floor(player.score / 3600).toString().padStart(2, '0');
                const mins = Math.floor((player.score % 3600) / 60).toString().padStart(2, '0');
                const secs = (player.score % 60).toString().padStart(2, '0');
                
                item.innerHTML = `
                    <span>#${index + 1} ${player.name}</span>
                    <span>${hrs}:${mins}:${secs}</span>
                `;
                leaderboardList.appendChild(item);
            });
        }
    </script>
</body>
</html>

</body>
