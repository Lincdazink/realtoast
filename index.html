    <div class="timer-container">

    <script>
        let startTime = 0;
        let timerInterval;
        let isRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let totalMinutes = Math.floor(totalSeconds / 60);
            let totalHours = Math.floor(totalMinutes / 60);

            let seconds = totalSeconds % 60;
            let minutes = totalMinutes % 60;
            let hours = totalHours;

            let hrsStr = String(hours).padStart(2, '0');
            let minsStr = String(minutes).padStart(2, '0');
            let secsStr = String(seconds).padStart(2, '0');

            return `${hrsStr}:${minsStr}:${secsStr}`;
        }

        function startTimer() {
            if (isRunning) return; 
            
            isRunning = true;
            startTime = performance.now();
            
            timerInterval = setInterval(() => {
                let elapsedTime = performance.now() - startTime;
                timerDisplay.textContent = formatTime(elapsedTime);
            }, 1000);
        }

        startBtn.addEventListener('click', startTimer);


      

  

       <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealToast Game & Leaderboard</title>
    <style>
        /* Base Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-container h1 {
            color: #ff9f43;
            font-size: 2.5rem;
            margin: 10px 0;
        }

        .header-container img {
            max-width: 150px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);

        /* Leaderboard Container */
        .leaderboard-wrapper {
            background-color: #2d2d2d;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }

        .leaderboard-wrapper h2 {
            margin-top: 0;
            text-align: center;
            color: #ff9f43;
            border-bottom: 2px solid #3d3d3d;
            padding-bottom: 10px;
        }

        /* Leaderboard List */
        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;

            margin-bottom: 8px;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .leaderboard-item:hover {
            transform: scale(1.02);
            background-color: #404040;
        }

        .leaderboard-item .rank {
            color: #ff9f43;
            margin-right: 10px;
        }

        .leaderboard-item .name {
            flex-grow: 1;
        }

        .leaderboard-item .score {
            color: #10ac84;
        }

        /* Controls and Forms */
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        input[type="text"], input[type="number"] {
            background-color: #3d3d3d;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            border-radius: 6px;

        }

            flex-grow: 2;

            width: 80px;

</head>
<body>

    <!-- Unified Header Section -->
    <div class="header-container">
        <img src="toast.png" alt="RealToast Logo" onerror="this.style.display='none'">
        <h1>RealToast Leaderboard</h1>
    </div>

    <!-- Working Leaderboard System -->
    <div class="leaderboard-wrapper">
        <h2>Top Toasts</h2>
        
        <ul class="leaderboard-list" id="leaderboardList">
            <!-- Dynamic scores render here via JavaScript -->
        </ul>

        <div class="input-group">
            <input type="text" id="playerName" placeholder="Player Name" maxlength="15">
            <input type="number" id="playerScore" placeholder="Score" min="0">
            <button onclick="addScore()">Submit</button>
        </div>
    </div>

    <script>
        // Clean LocalStorage Initialization
        let highScores = JSON.parse(localStorage.getItem('realtoast_scores')) || [
            { name: "ToastMaster", score: 2500 },
            { name: "BurntBread", score: 1200 },
            { name: "ButterLover", score: 850 }
        ];

        // Renders the board cleanly sorted from highest to lowest
        function updateLeaderboardUI() {
            const listElement = document.getElementById('leaderboardList');
            listElement.innerHTML = '';

            // Sort scores natively by highest points
            highScores.sort((a, b) => b.score - a.score);
            
            // Limit leaderboard representation to top 5 players
            const topScores = highScores.slice(0, 5);

            topScores.forEach((player, index) => {
                const item = document.createElement('li');
                item.className = 'leaderboard-item';
                item.innerHTML = `
                    <span class="rank">#${index + 1}</span>
                    <span class="name">${escapeHTML(player.name)}</span>
                    <span class="score">${player.score} pts</span>
                `;
                listElement.appendChild(item);
            });

            // Save the state persistently
            localStorage.setItem('realtoast_scores', JSON.stringify(highScores));
        }

        // Functional Submission Handler
        function addScore() {
            const nameInput = document.getElementById('playerName');
            const scoreInput = document.getElementById('playerScore');
            
            const name = nameInput.value.trim();
            const score = parseInt(scoreInput.value, 10);

            if (name === '' || isNaN(score) || score < 0) {
                alert('Please enter a valid name and score.');
                return;
            }

            // Append data, refresh UI layout, clear form inputs
            highScores.push({ name: name, score: score });
            updateLeaderboardUI();

            nameInput.value = '';
            scoreInput.value = '';
        }

        // Helper to prevent script injection (XSS validation)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Run UI preparation on application boot
        window.onload = updateLeaderboardUI;
    </script>
</body>
</html>
