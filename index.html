<!DOCTYPE html> 
<body>


<h1>                                              BREAD</h1>
  
  <h2> I like bread so i made this. whoever gets the most breads gets cheetos. goodluck. -Linc </h2>
  <img src="https://img.magnific.com/premium-photo/toast-bread-white-background_326533-190.jpg" alt="toast" width="600" height="300">
 
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Up Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .timer-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .display {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            font-family: monospace;
        }
        button {
            font-size: 1rem;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background-color: #28a745; color: white; }
        .btn-start:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="timer-container">
        <div class="display" id="timerDisplay">00:00:00</div>
        <button class="btn-start" id="startBtn">Start</button>
    </div>

    <script>
        let startTime = 0;
        let timerInterval;
        let isRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');

        function formatTime(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let totalMinutes = Math.floor(totalSeconds / 60);
            let totalHours = Math.floor(totalMinutes / 60);

            let seconds = totalSeconds % 60;
            let minutes = totalMinutes % 60;
            let hours = totalHours;

            let hrsStr = String(hours).padStart(2, '0');
            let minsStr = String(minutes).padStart(2, '0');
            let secsStr = String(seconds).padStart(2, '0');

            return `${hrsStr}:${minsStr}:${secsStr}`;
        }

        function startTimer() {
            if (isRunning) return; 
            
            isRunning = true;
            startTime = performance.now();
            
            timerInterval = setInterval(() => {
                let elapsedTime = performance.now() - startTime;
                timerDisplay.textContent = formatTime(elapsedTime);
            }, 1000);
        }

        startBtn.addEventListener('click', startTimer);

  </script>
    </script>

</body>
</html>

</body>
